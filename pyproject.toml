[project]
name = "warehousetwin-tools"
version = "1.0.0"
description = "Build-time tooling for Logistics Flow Studio - WarehouseTwin (icon generation). The app itself is static HTML/CSS/JS with no Python runtime dependency."
requires-python = ">=3.9"
dependencies = ["pillow>=10"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
